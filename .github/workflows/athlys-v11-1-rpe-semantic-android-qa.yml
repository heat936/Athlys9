name: Athlys V11.1 — signed Android RPE language + personal ML QA release
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v11-1-rpe-semantic-android-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_SHA: 5d31a5cfa581ae8d9bfbc3814f2a50051a59b685
      EXPECTED_BASE: f784e4f3f849a667ffc5cd5c8cb8093ceb164b5fece212a4c29462684403c1f4
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: 5d31a5cfa581ae8d9bfbc3814f2a50051a59b685
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify already-passed 70 tests and exact signed V10 baseline APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(gh run view 45286876971 --repo heat936/Athlys9 --json conclusion --jq .conclusion)" = success
          mkdir -p baseline output
          gh release download athlys-v10-flm-quantum-qa-20261123 --repo heat936/Athlys9 \
            --pattern Athlys-V10-FLM-Quantum.apk --dir baseline
          echo "$EXPECTED_BASE  baseline/Athlys-V10-FLM-Quantum.apk" | sha256sum --check
          unzip -t baseline/Athlys-V10-FLM-Quantum.apk >/dev/null
          unzip -p baseline/Athlys-V10-FLM-Quantum.apk assets/public/app-config.js | grep -q 'avonfqgechvrnqxmbufn.supabase.co'
          ! unzip -p baseline/Athlys-V10-FLM-Quantum.apk assets/public/app-config.js | grep -q 'ixccwxonchzzjdjeajzw'
          echo 'PASS baseline V10 debug signed and staging-only'
      - name: Overlay reviewed V11 HTML/JS and semantic model; preserve native Android components
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          source=Path("source/web")
          names=["athlys-rpe-semantic-ml.js","athlys-local-intelligence.js","app.js","app.html","mobile.html","sw.js"]
          for name in names:
              path=source/name
              assert path.is_file() and path.stat().st_size>100,name
          assert b'athlys-rpe-semantic-ml.js' in (source/"mobile.html").read_bytes()
          assert b'athlys-rpe-semantic-ml.js' in (source/"app.html").read_bytes()
          assert b'textModelStatus' in (source/"app.js").read_bytes()
          assert b'completed !== true' in (source/"athlys-local-intelligence.js").read_bytes()
          src=Path("baseline/Athlys-V10-FLM-Quantum.apk")
          outfile=Path("output/Athlys-V11.1-RPE-Language-QA-unsigned.apk")
          with ZipFile(src) as b, ZipFile(outfile,"w") as out:
              prior=set(b.namelist())
              for name in ("assets/public/app-config.js","assets/public/athlys-excel-import.js",
                  "assets/public/athlys-light-lm-runtime/assistant.js",
                  "assets/public/athlys-light-lm-runtime/wllama.wasm",
                  "assets/public/assets/athlys-v10-trajectoire.mp4"):
                  assert name in prior,"MISSING_BASE_ASSET_"+name
              changed={"assets/public/"+name for name in names}
              for info in b.infolist():
                  if info.filename in changed or info.filename.startswith("META-INF/"):continue
                  out.writestr(info,b.read(info.filename))
              for name in names:
                  out.write(source/name,arcname="assets/public/"+name,compress_type=ZIP_DEFLATED)
          with ZipFile(outfile) as z:
              assert changed.issubset(set(z.namelist()))
              assert b'athlys-rpe-semantic-ml.js' in z.read("assets/public/mobile.html")
              assert b'athlys-rpe-semantic-ml.js' in z.read("assets/public/app.html")
              assert b'walk_forward_no_gain' in z.read("assets/public/athlys-rpe-semantic-ml.js")
              assert b'avoid same-day/forward labels' in z.read('assets/public/athlys-local-intelligence.js')
              assert b'ixccwxonchzzjdjeajzw' not in z.read("assets/public/app-config.js")
              assert not any(x.lower().endswith('.gguf') for x in z.namelist())
          print("PASS V11 semantic ML, FLM adapter, Excel data contract, Quantum and staging backend in APK")
          PY
      - name: Independently QA-sign new APK and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 output/Athlys-V11.1-RPE-Language-QA-unsigned.apk output/Athlys-V11.1-RPE-Language-QA.apk
          keytool -genkeypair -noprompt -alias athlys_v11_rpe_qa \
            -keystore "$RUNNER_TEMP/athlys-v11-qa.jks" \
            -storepass QAandroid123 -keypass QAandroid123 -keyalg RSA -keysize 3072 -validity 7 \
            -dname 'CN=Athlys V11 RPE Semantic QA, O=Athlys, C=FR' >/dev/null 2>&1
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/athlys-v11-qa.jks" --ks-key-alias athlys_v11_rpe_qa \
            --ks-pass pass:QAandroid123 --key-pass pass:QAandroid123 \
            --v1-signing-enabled true --v2-signing-enabled true output/Athlys-V11.1-RPE-Language-QA.apk
          "$TOOLS/apksigner" verify --verbose output/Athlys-V11.1-RPE-Language-QA.apk | grep -q 'Verified using v2 scheme.*true'
          "$TOOLS/zipalign" -c -p 4 output/Athlys-V11.1-RPE-Language-QA.apk
          unzip -t output/Athlys-V11.1-RPE-Language-QA.apk >/dev/null
          (cd output && sha256sum Athlys-V11.1-RPE-Language-QA.apk > SHA256SUMS.txt)
          echo 'PASS independently QA-signed V11 Android APK'
      - uses: actions/upload-artifact@v4
        with:
          name: athlys-v11-rpe-language-android-qa
          retention-days: 14
          if-no-files-found: error
          path: |
            output/Athlys-V11.1-RPE-Language-QA.apk
            output/SHA256SUMS.txt
      - name: Publish immutable Android QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=athlys-v11-1-rpe-semantic-qa-20261123
          if gh release view "$TAG" --repo heat936/Athlys9 >/dev/null 2>&1; then
            echo "::error::V11 release already exists: not overwriting"; exit 1
          fi
          gh release create "$TAG" --repo heat936/Athlys9 \
            output/Athlys-V11.1-RPE-Language-QA.apk output/SHA256SUMS.txt \
            --title 'Athlys V11.1 — Lecture intelligente des séances et RPE individualisé (Android QA)' \
            --notes 'Préversion de recette V11.1 corrigeant la fuite temporelle (aucun RPE du jour ou futur dans la projection historique). Programme d’athlétisme en texte libre : extraction de séries, distances, récupérations et spécialités ; régression individuelle locale de résidu RPE fondée sur séances terminées, appariées et antérieures ; activation uniquement après preuve de gain chronologique sur l’historique de l’athlète. Option FLM local : catégorie textuelle uniquement si citation exacte vérifiée et modèle préalablement installé ; poids GGUF non inclus. AUCUNE garantie 95% ni validation médicale. Conserve Excel et Dual Perception. Backend Supabase2 staging, pas Athlys production. Signé QA avec nouveau certificat, utilise le même package com.athlys.v10irlqa : désinstaller UNIQUEMENT l’ancienne APK de recette si nécessaire, jamais l’application principale. La compatibilité Android 14 exige une vérification d’émulateur distincte. Web QA : https://athlys-v10-irl-staging.vercel.app/app.html.' \
            --prerelease
          gh release view "$TAG" --repo heat936/Athlys9 --json assets --jq '.assets[].name' | grep -qx Athlys-V11.1-RPE-Language-QA.apk
          echo 'PASS immutable V11 Android QA release'
