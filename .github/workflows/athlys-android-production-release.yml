name: Athlys signed Android release (guarded)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Approved Athlys2 ref
        required: true
        default: redesign/clean-slate-v3-20261118
permissions:
  contents: read
concurrency:
  group: athlys-android-production-signing
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: android-production
    steps:
      - name: Validate signing prerequisites
        env:
          SOURCE_TOKEN: ${{ secrets.ATHLYS_READ_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ATHLYS_SIGNING_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ATHLYS_SIGNING_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ATHLYS_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATHLYS_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SOURCE_TOKEN" && test -n "$KEYSTORE_B64" && test -n "$KEY_ALIAS" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || { echo "::error::Production signing secrets not configured"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Full source and independent FLM validation gates
        run: |
          npm test
          node --check web/app.js
          node --test tests/athlys-release-gates.test.cjs
          test -s scripts/build-web-compat.cjs
          test -s models/flm/approved-validation.json || { echo "::error::Trained FLM independently validated model evidence absent"; exit 1; }
          node -e "const x=require('./models/flm/approved-validation.json');if(x.status!=='approved'||!x.model_digest||!x.evaluation_dataset||!x.reviewed_by||!x.reviewed_at)process.exit(1)"
      - name: Build web and Android
        run: |
          npm run build:web
          node --check web/app.js
          node --check web/intent-launcher.bundle.js
          npx cap add android
          npx cap sync android
      - name: Configure generated Android for Health Connect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'compileOptions {' not in s:
              s=s.replace('android {','android {\n    compileOptions {\n      sourceCompatibility JavaVersion.VERSION_17\n      targetCompatibility JavaVersion.VERSION_17\n    }',1)
          if 'coreLibraryDesugaringEnabled' not in s:
              s=s.replace('compileOptions {','compileOptions {\n      coreLibraryDesugaringEnabled true',1)
          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in s:
              s=s.replace('dependencies {',"dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'",1)
          p.write_text(s)
          variables=Path('android/variables.gradle')
          v=variables.read_text()
          v,n=re.subn(r'(minSdkVersion\s*=\s*)\d+',r'\g<1>26',v,count=1)
          if n!=1: raise RuntimeError('Missing minSdk')
          variables.write_text(v)
          PY
      - name: Require documented Android release acceptance
        run: |
          test -s docs/qa/approved-android-release.json || { echo "::error::Android acceptance evidence not approved"; exit 1; }
          node -e "const a=require('./docs/qa/approved-android-release.json');if(a.status!=='approved'||!a.physical_device_test||!a.accessibility_review||!a.reviewer||!a.review_date)process.exit(1)"
      - name: Build unsigned release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign and verify production APK
        env:
          KEYSTORE_B64: ${{ secrets.ATHLYS_SIGNING_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ATHLYS_SIGNING_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ATHLYS_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATHLYS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f signing.jks aligned.apk' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing.jks
          chmod 600 signing.jks
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks signing.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out Athlys-Android-Release.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Athlys-Android-Release.apk
          unzip -Z1 Athlys-Android-Release.apk | grep -q 'assets/public/feather-runtime.js'
          unzip -Z1 Athlys-Android-Release.apk | grep -q 'assets/public/athlys-ui-v3.css'
          sha256sum Athlys-Android-Release.apk > Athlys-Android-Release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: athlys-android-signed-production
          path: |
            Athlys-Android-Release.apk
            Athlys-Android-Release.apk.sha256
          retention-days: 14
          if-no-files-found: error
