name: Athlys V3.3 — isolated browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/athlys-v33-browser-acceptance.yml']
permissions:
  contents: read
jobs:
  simulated-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: redesign/clean-slate-v3-20261118
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Serve isolated source and test nine role/viewport combinations
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory web --bind 127.0.0.1 >/tmp/athlys-test-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for i in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/mobile.html',timeout=1)
                  break
              except Exception:
                  time.sleep(.3)
          else: raise SystemExit("isolated local test server unavailable")
          PY
          python tests/browser-v33-auth-mock.py
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-v33-isolated-browser-acceptance
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 14
