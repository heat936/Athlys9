name: Athlys V10 Training Studio — QA APK download
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v10-training-studio-download.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact V10 branded QA build
        uses: actions/download-artifact@v4
        with:
          name: athlys-v10-qa-android
          run-id: 45246100319
          github-token: ${{ github.token }}
          path: package
      - name: Verify signed QA APK and attach clear release notes
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sed -i 's#release/Athlys-V10-Test-Android.apk#Athlys-V10-Test-Android.apk#' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t Athlys-V10-Test-Android.apk >/dev/null
          test "$(stat -c %s Athlys-V10-Test-Android.apk)" -gt 1000000
          unzip -Z1 Athlys-V10-Test-Android.apk | grep 'assets/public/assets/athlys-v10-trajectoire.mp4' >/dev/null
          mv Athlys-V10-Test-Android.apk Athlys-V10-Training-Studio-QA.apk
          sed -i 's/Athlys-V10-Test-Android.apk/Athlys-V10-Training-Studio-QA.apk/g' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo 'PASS: exact GitHub Actions candidate checksum verified'
      - name: Publish V10 QA APK as prerelease (no source or secrets)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view athlys-v10-training-studio-qa >/dev/null 2>&1; then
            gh release upload athlys-v10-training-studio-qa package/Athlys-V10-Training-Studio-QA.apk package/SHA256SUMS.txt --clobber
          else
            gh release create athlys-v10-training-studio-qa \
              package/Athlys-V10-Training-Studio-QA.apk package/SHA256SUMS.txt \
              --title 'Athlys V10 Training Studio — APK de recette Android' \
              --notes 'APK Android V10 de test, package com.athlys.v10studioqa. Animation Trajectoire originale intégrée hors ligne. SDK Supabase intégré localement, connexion initialisée avec délai borné, démarrage vérifié. Signature debug différente de v9 ; installation parallèle. Ne pas considérer cette APK comme une mise à jour de production ni comme une validation complète des connexions Supabase réelles.' \
              --prerelease
          fi
          gh release edit athlys-v10-training-studio-qa --notes 'Athlys V10 Training Studio — préversion de recette Android, package isolé com.athlys.v10studioqa, signature debug différente de la v9. L’animation Trajectoire d’origine et le SDK Supabase sont inclus localement. Tests de code, compilation et lancement sur Android 14 réalisés ; contrôle réseau coupé en cours de validation. Installation parallèle uniquement ; ne garantit pas la synchronisation authentifiée entre deux appareils ni le GO production.'
          gh release view athlys-v10-training-studio-qa --json assets --jq '.assets[].name' | grep -qx Athlys-V10-Training-Studio-QA.apk
          echo 'PASS: public QA APK download available'
