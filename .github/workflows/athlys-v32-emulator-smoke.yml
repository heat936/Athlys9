name: Athlys V3.2 — Android emulator smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/athlys-v32-emulator-smoke.yml'
permissions:
  actions: read
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact V3.2 artifact, no rebuild
        uses: actions/download-artifact@v4
        with:
          name: athlys-clean-slate-v3-debug-apk
          run-id: 44358848564
          github-token: ${{ github.token }}
          path: target
      - name: Confirm APK checksum
        run: |
          test -s target/android/app/build/outputs/apk/debug/app-debug.apk
          grep 'app-debug.apk' target/athlys-clean-slate-v3.sha256
          (cd target && sha256sum -c athlys-clean-slate-v3.sha256)
      - name: Boot Android 35 and launch Athlys WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            APK=target/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            PKG=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            test -n "$PKG"
            echo "Package under test: $PKG"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell dumpsys activity activities > activity.txt
            grep -F "$PKG" activity.txt
            adb shell uiautomator dump /sdcard/athlys-ui.xml
            adb pull /sdcard/athlys-ui.xml ./athlys-ui.xml
            adb shell screencap -p /sdcard/athlys-screen.png
            adb pull /sdcard/athlys-screen.png ./athlys-screen.png
            adb logcat -d -t 4000 > athlys-logcat.txt
            if grep -A25 'FATAL EXCEPTION' athlys-logcat.txt | grep -F "$PKG"; then
              echo "::error::Athlys app crash found in logcat"
              exit 1
            fi
            test -s athlys-screen.png
            test -s athlys-ui.xml
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-v32-emulator-evidence
          path: |
            athlys-screen.png
            athlys-ui.xml
            activity.txt
            athlys-logcat.txt
          if-no-files-found: warn
          retention-days: 14
