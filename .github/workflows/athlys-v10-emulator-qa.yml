name: Athlys V10 QA — Android emulator opening and login smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/athlys-v10-emulator-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download precisely identified V10 QA APK
        uses: actions/download-artifact@v4
        with:
          name: athlys-v10-qa-android
          run-id: 45218205409
          github-token: ${{ github.token }}
          path: candidate

      - name: Check APK integrity, package and opening files
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/Athlys-V10-Test-Android.apk
          expected="$(awk '{print $1}' candidate/SHA256SUMS.txt)"
          actual="$(sha256sum candidate/Athlys-V10-Test-Android.apk | cut -d' ' -f1)"
          test "$actual" = "$expected"
          unzip -t candidate/Athlys-V10-Test-Android.apk > /tmp/v10-zip.log
          unzip -Z1 candidate/Athlys-V10-Test-Android.apk | grep -q 'assets/public/mobile-opening-v10.js'
          unzip -Z1 candidate/Athlys-V10-Test-Android.apk | grep -q 'assets/public/mobile-opening-v10.css'
          mkdir -p qa
          printf 'source-artifact=45218205409\nsha256=%s\n' "$actual" > qa/manifest.txt
          echo 'PASS: isolated V10 APK verified before emulator'

      - name: Enable KVM for emulator where available
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || echo "::warning::KVM not available; emulator may fail to boot"

      - name: Start V10 and capture opening / after-loading on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 480
          disable-animations: false
          script: |
            set -euo pipefail
            adb install -r candidate/Athlys-V10-Test-Android.apk > qa/install.txt 2>&1
            adb shell am start -n com.athlys.v10preview/.MainActivity > qa/launch.txt 2>&1
            adb shell pidof com.athlys.v10preview | grep -Eq '[0-9]+'
            sleep 2
            adb shell screencap -p /sdcard/athlys-v10-opening.png
            adb pull /sdcard/athlys-v10-opening.png qa/launch-opening.png >/dev/null
            sleep 8
            adb shell screencap -p /sdcard/athlys-v10-postloading.png
            adb pull /sdcard/athlys-v10-postloading.png qa/launch-postloading.png >/dev/null
            adb shell pidof com.athlys.v10preview | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep 'com.athlys.v10preview' > qa/foreground.txt
            test -s qa/launch-opening.png && test -s qa/launch-postloading.png
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|Process: com.athlys.v10preview' > qa/crash-check.txt; then
              echo '::error::ANDROID_RUNTIME_FATAL_EXCEPTION'; exit 1
            fi
            echo 'PASS: V10 installed, opened, remained active and produced two screenshots'

      - name: Archive screenshots and status (no personal data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-v10-emulator-qa-evidence
          retention-days: 14
          if-no-files-found: warn
          path: qa/
