name: Athlys Field Beta — real Supabase Auth JWT QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      EXPECTED_SHA: 221a65c94dd37527d723c85379cfe066ba4e079f
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: 221a65c94dd37527d723c85379cfe066ba4e079f
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live GoTrue sessions and Supabase row-level access
        shell: bash
        env:
          ATHLYS_QA_COACH_EMAIL: ${{ secrets.ATHLYS_QA_COACH_EMAIL }}
          ATHLYS_QA_COACH_PASSWORD: ${{ secrets.ATHLYS_QA_COACH_PASSWORD }}
          ATHLYS_QA_ATHLETE_EMAIL: ${{ secrets.ATHLYS_QA_ATHLETE_EMAIL }}
          ATHLYS_QA_ATHLETE_PASSWORD: ${{ secrets.ATHLYS_QA_ATHLETE_PASSWORD }}
          ATHLYS_QA_OUTSIDER_EMAIL: ${{ secrets.ATHLYS_QA_OUTSIDER_EMAIL }}
          ATHLYS_QA_OUTSIDER_PASSWORD: ${{ secrets.ATHLYS_QA_OUTSIDER_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm install --no-audit --no-fund >/tmp/qa-npm.log 2>&1
          node tests/athlys-real-supabase-auth-qa.cjs
      - name: Archive status-only results (no tokens or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-real-supabase-auth-qa-results
          retention-days: 7
          if-no-files-found: ignore
          path: qa-evidence/real-auth-results.json
