name: Athlys V4 — actual browser UI acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/athlys-charter-v4-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: redesign/charter-only-v4-20261118
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Record browser evidence provenance
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('Invalid source SHA')
          evidence = {
              'source_repository': 'heat936/Athlys2',
              'source_ref': 'redesign/charter-only-v4-20261118',
              'source_commit': source_sha,
              'workflow_repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'evidence_type': 'browser-ui-acceptance'
          }
          Path('test-evidence').mkdir(exist_ok=True)
          Path('test-evidence/browser-provenance.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Browser tested source commit:', source_sha)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local WebView scripts and self-hosted Inter before screenshots
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npm run test:athletics
          node --check web/athletics-fields.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible Chromium and browser tests
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      # V4.3.1 acceptance: authenticated Club uses real mobile tab navigation and Plus sign-out.
      - name: Nine isolated role/viewport tests and screenshots
        run: |
          set -euo pipefail
          python -m py_compile tests/browser-v33-auth-mock.py
          python -m http.server 8765 --directory web --bind 127.0.0.1 >/tmp/athlys-v4-local.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/mobile.html',timeout=2)
                  break
              except Exception:
                  time.sleep(.3)
          else: raise SystemExit('V4 local browser server unavailable')
          PY
          python tests/browser-v33-auth-mock.py
          python tests/browser-v4-desktop-club.py
          python tests/browser-v4-club-auth-mock.py
      - name: Archive V4 screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-v4-browser-evidence
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 30
