name: Athlys Training Studio — isolated full QA
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-training-studio-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout private Athlys source
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: f2d72f624b5f853f338512715e7fe34dfc9d36f8
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source provenance and syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node --check web/app.js
          node --check web/athlys-strength-lab.js
          node --check web/mobile-opening-v10.js
          node --check web/athletics-fields.js
          echo "PASS: all changed frontend modules parse"
      - name: Install pinned project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >"$RUNNER_TEMP/athlys-training-install.log" 2>&1 || {
            tail -n 35 "$RUNNER_TEMP/athlys-training-install.log"; exit 1;
          }
      - name: Test training, strength, and core intelligence
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Test critical non-regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --test web/mobile-experience.test.cjs web/performance-engine.test.cjs web/quantum-engine.test.cjs web/site-vitrine.test.cjs
      - name: Web bundles and release gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build:web
          npm run test:supabase-migrations
          echo "PASS: strength, training, mobile, quantitative calculations, SQL migration contracts, bundles"
