name: Athlys V5 — private product acceptance on public runner
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/athlys-v5-product-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout authorized private source without persisting token
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: 03c7c9509ab25e948b2cbae8651b44db35748e48
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cross-platform source syntax
        run: |
          node --check web/app.js
          node --check web/dual-perception.js
          node --check web/athletics-fields.js
          node --check web/sw.js
          node --check web/offline-sync.js
          node --check web/offline-store.js
          node --check web/feather-runtime.js
          node --check web/mobile.js
          node --check web/club.js
      - name: Run all synthetic product tests without exposing private failure traces
        shell: bash
        run: |
          set -euo pipefail
          for task in test:athletics test:dual-perception test:offline-sync test:feather test:feather-platform test:flm-product; do
            if npm run "$task" > /tmp/athlys-product-test.log 2>&1; then
              echo "PASS: $task"
            else
              echo "::error::FAILED: $task (private details withheld)"
              exit 1
            fi
          done
      - name: Validate mobile and desktop shell dependencies
        shell: bash
        run: |
          if node --test tests/v5-shell-contract.test.cjs > /tmp/athlys-shell-test.log 2>&1; then
            echo "PASS: V5 shared shell contracts"
          else
            echo "::error::FAILED: V5 shared shell contracts (private details withheld)"
            exit 1
          fi
      - name: Mark product checks complete
        run: echo "Private source tests completed on ephemeral runner; no source or athlete information uploaded as artifacts."
