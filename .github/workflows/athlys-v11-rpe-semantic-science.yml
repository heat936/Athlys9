name: Athlys V11 RPE semantic language + personalization — scientific and Web build
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v11-rpe-semantic-science.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_SHA: ec792a04abf181af1c49fc982dcdcad0ff6a051d
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: ec792a04abf181af1c49fc982dcdcad0ff6a051d
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable source, no exfiltration and explicit temporal training guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -q 'completed!==true' web/athlys-rpe-semantic-ml.js
          grep -q 'date>=asOf' web/athlys-rpe-semantic-ml.js
          grep -q 'walk_forward_no_gain' web/athlys-rpe-semantic-ml.js
          grep -q 'textEvidence:"local-walk-forward-only-not-external"' web/athlys-rpe-semantic-ml.js
          grep -q 'window.AthlysRPESemanticML' web/app.js
          grep -q 'athlys-rpe-semantic-ml.js' web/mobile.html
          grep -q 'athlys-rpe-semantic-ml.js' web/app.html
          ! grep -qi '95% validated' web/athlys-rpe-semantic-ml.js
          node --check web/athlys-rpe-semantic-ml.js
          node --check tests/athlys-rpe-semantic-v11.test.cjs
          node --check web/app.js
          node --check web/sw.js
          echo 'PASS pinned scientific source and safe semantic boundaries'
      - name: Install and execute all existing and v11 regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
      - name: Build Web and version-pinned optional FLM runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build:web
          test -s web/supabase-client.bundle.js
          test -s web/athlys-light-lm-runtime/assistant.js
          test -s web/athlys-light-lm-runtime/wllama.wasm
          test ! -e web/athlys-light-lm-runtime/model.gguf
          echo 'PASS Web V11 with semantic RPE and FLM runtime (without GGUF weights)'
      - uses: actions/upload-artifact@v4
        with:
          name: athlys-v11-rpe-semantic-web-sources
          retention-days: 10
          if-no-files-found: error
          path: |
            web/athlys-rpe-semantic-ml.js
            web/athlys-local-intelligence.js
            web/app.js
            web/app.html
            web/mobile.html
            web/sw.js
            web/athlys-light-lm-runtime/model.json
            tests/athlys-rpe-semantic-v11.test.cjs
