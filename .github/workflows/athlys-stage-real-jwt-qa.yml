name: Athlys Staging — real JWT & RLS (3 synthetic identities)
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-stage-real-jwt-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jwt-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      ATHLYS_QA_STAGE_URL: https://avonfqgechvrnqxmbufn.supabase.co
      ATHLYS_QA_STAGE_KEY: sb_publishable_DmH8goDuKIUhmxhATfKanQ_emVtrEeT
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create synthetic identities and validate real Supabase Auth JWT and RLS
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const crypto=require("node:crypto"),assert=require("node:assert/strict");
          const base=process.env.ATHLYS_QA_STAGE_URL,apiKey=process.env.ATHLYS_QA_STAGE_KEY;
          const tag=process.env.GITHUB_RUN_ID,accounts=["coach","athlete","outsider"].map(role=>({
           role,email:"athlys-qa-"+tag+"-"+role+"@gmail.com",password:crypto.randomBytes(30).toString("base64url")
          }));
          const headers={"apikey":apiKey,"Content-Type":"application/json"};
          const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
          async function call(method,path,token,payload,extra={}){
           const h={...headers,...(token?{"Authorization":"Bearer "+token}:{}),...extra};
           const r=await fetch(base+path,{method,headers:h,...(payload!==undefined?{body:JSON.stringify(payload)}:{})});
           const text=await r.text();let json;try{json=text?JSON.parse(text):null}catch{json={raw:text.slice(0,300)}}
           return {status:r.status,ok:r.ok,data:json};
          }
          async function attempt(a){
           const res=await call("POST","/auth/v1/token?grant_type=password",null,{email:a.email,password:a.password});
           return res.ok&&res.data?.access_token?res.data:null;
          }
          async function table(a,path,method="GET",body){
           return call(method,"/rest/v1/"+path,a.token,body,method==="POST"||method==="PATCH"?{"Prefer":"return=representation"}:{});
          }
          (async()=>{
           console.log("STAGE_QA_RUN="+tag+"; project=avonfqgechvrnqxmbufn; synthetic identities only; passwords never logged");
           for(const a of accounts){
            const r=await call("POST","/auth/v1/signup",null,{email:a.email,password:a.password,data:{role:a.role==="outsider"?"athlete":a.role,first_name:"Athlys",last_name:"SyntheticQA"}});
            if(!r.ok||!r.data?.id){console.error("QA_SIGNUP_"+a.role+"_FAILED: HTTP "+r.status+" "+String(r.data?.msg||r.data?.message||r.data?.error_code||"unknown"));process.exitCode=2;return}
            a.id=r.data.id;
            console.log("QA_SIGNUP_CREATED role="+a.role+" id="+a.id+" (pending profile & verification)");
           }
           console.log("STAGE_QA_FIXTURES_CREATED="+tag+"; waiting for staging SQL confirmation/profile/link setup.");
           const until=Date.now()+240000;
           while(Date.now()<until){
            let ready=true;
            for(const a of accounts){if(!a.token){const signed=await attempt(a);if(signed?.access_token){a.token=signed.access_token;const u=await call("GET","/auth/v1/user",a.token);assert.equal(u.data?.id,a.id,"Real JWT subject must equal signed-in user");const jwt=JSON.parse(Buffer.from(a.token.split(".")[1],"base64url").toString());assert.equal(jwt.sub,a.id);assert.equal(jwt.role,"authenticated");console.log("REAL_JWT_PASS "+a.role+" id="+a.id);}else ready=false}}
            if(ready)break;
            await sleep(4000);
           }
           if(accounts.some(a=>!a.token)){console.error("BLOCKED: email confirmation or login pending; staging accounts can be deleted by run prefix "+tag);process.exitCode=3;return}
           const coach=accounts[0],athlete=accounts[1],outsider=accounts[2];
           // Wait until staging fixtures are visible under the real RLS policy.
           let views;
           for(let i=0;i<12;i++){
            views=await Promise.all(accounts.map(a=>table(a,"profiles?select=id%2Crole")));
            if(views.every(x=>x.ok)&&views[0].data.some(x=>x.id===coach.id)&&views[1].data.some(x=>x.id===athlete.id)&&views[2].data.some(x=>x.id===outsider.id))break;
            await sleep(4000);
           }
           for(const v of views)assert(v.ok,"Profiles RLS query must succeed");
           const ids=views.map(v=>v.data.map(x=>x.id));
           assert.deepEqual(ids[0].sort(),[coach.id,athlete.id].sort(),"Coach sees self + linked athlete only");
           assert.deepEqual(ids[1].sort(),[coach.id,athlete.id].sort(),"Athlete sees self + linked coach only");
           assert.deepEqual(ids[2],[outsider.id],"Outsider sees self only");
           console.log("PROFILE_RLS_PASS coach, athlete, outsider");
           const links=await Promise.all(accounts.map(a=>table(a,"coach_athletes?select=coach_id%2Cathlete_id")));
           for(const l of links)assert(l.ok,"RLS links query must succeed");
           assert.equal(links[0].data.length,1);
           assert.equal(links[1].data.length,1);
           assert.equal(links[2].data.length,0);
           assert.equal(links[0].data[0].coach_id,coach.id);
           assert.equal(links[1].data[0].athlete_id,athlete.id);
           console.log("LINK_RLS_PASS coach + athlete see link; outsider isolated");
           const body={coach_id:coach.id,athlete_id:athlete.id,created_by:coach.id,title:"QA synthetic calendar "+tag,starts_at:new Date(Date.now()+86400000).toISOString(),session_type:"Entraînement",coach_supervises:true};
           const event=await table(coach,"calendar_events", "POST",body);
           assert(event.ok&&Array.isArray(event.data)&&event.data.length===1,"Coach inserts authorized event");
           const eventId=event.data[0].id;
           const path="calendar_events?select=id%2Ccoach_id%2Cathlete_id&id=eq."+eventId;
           const events=await Promise.all(accounts.map(a=>table(a,path)));
           for(const ev of events)assert(ev.ok,"RLS event read succeeds");
           assert.deepEqual(events.map(x=>x.data.length),[1,1,0],"Coach and athlete see event, third party does not");
           const cross=await table(outsider,"calendar_events", "POST",{...body,created_by:outsider.id,title:"QA unauthorized insert"});
           assert(!cross.ok,"Unrelated outsider cannot insert event into coach athlete scope");
           const del=await table(coach,"calendar_events?id=eq."+eventId,"DELETE");
           assert(del.ok,"Coach removes temporary QA event");
           console.log("CALENDAR_RLS_PASS real JWT for 3 roles; outsider insert denied; QA event deleted");
           console.log("QA_FINAL_PASS_STAGING_JWT_RLS run="+tag);
          })().catch(e=>{console.error("QA_ERROR "+(e&&e.message||String(e)));process.exitCode=1});
          
          NODE
