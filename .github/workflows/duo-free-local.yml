name: Duo Bridge — free local two-model test
on:
  push:
    branches: [duo/free-local-models-20261119]
    paths:
      - .github/workflows/duo-free-local.yml
      - duo-bridge-public/free_local_bridge.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-independent-models:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama locally, without credentials
        run: |
          set -euo pipefail
          curl --retry 3 --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          ollama --version
      - name: Start Ollama server
        run: |
          ollama serve >/tmp/ollama-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 30 /tmp/ollama-server.log
          exit 1
      - name: Download two independent open models
        run: |
          ollama pull qwen2.5:0.5b
          ollama pull smollm2:360m
      - name: Execute independent proposal and review
        run: python3 duo-bridge-public/free_local_bridge.py
      - name: Upload synthetic report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duo-free-local-proof
          path: duo-free-local-result.json
          retention-days: 7
