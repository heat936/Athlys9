name: Athlys V6 unified workspace — Windows x64 installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/athlys-v6-windows.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Fetch Athlys V6 private source
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: 4a45e111b701066c4edf9c4cadad5a0e2173dda4
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
          path: app
      - name: Fetch unified workspace
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: df38b49afa51ada3896f5f73cfc28550a49c5156
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
          path: workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged navigation and official visual charter
        shell: pwsh
        run: |
          node --check app/web/unified-workspace.js
          node --check app/web/app.js
          node --check app/web/club.js
          if (!(Test-Path app/web/athlys-visual-charter-v1.css)) { throw 'Official charter CSS missing' }
          if (!(Test-Path app/web/assets/athlys-symbol-free.svg)) { throw 'Official dark-mode symbol missing' }
          if (!(Select-String -Quiet -Path app/web/index.html -SimpleMatch 'athlys-visual-charter-v1.css')) { throw 'Web charter link missing' }
          if (!(Select-String -Quiet -Path app/web/club-app.html -SimpleMatch 'athlys-visual-charter-v1.css')) { throw 'Club charter link missing' }
      - name: Test original V6 source and build Web
        working-directory: app
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Athlys Windows x64
        shell: pwsh
        run: |
          Push-Location app/desktop
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Package Athlys Club Windows x64
        shell: pwsh
        run: |
          Push-Location app/desktop-club
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node copy-web.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ../web/unified-workspace.css web/unified-workspace.css
          Copy-Item ../web/unified-workspace.js web/unified-workspace.js
          Copy-Item ../web/athlys-visual-charter-v1.css web/athlys-visual-charter-v1.css
          New-Item -ItemType Directory -Force -Path web/assets | Out-Null
          Copy-Item ../web/assets/athlys-symbol-free.svg web/assets/athlys-symbol-free.svg
          Copy-Item ../web/assets/athlys-lockup-inverse.svg web/assets/athlys-lockup-inverse.svg
          if (!(Test-Path web/athlys-visual-charter-v1.css)) { throw 'Missing official charter CSS in Club Windows package' }
          npx electron-builder --win nsis portable --x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Verify release artifacts and provenance
        shell: pwsh
        run: |
          $exe1=Get-ChildItem app/desktop/dist -Filter *.exe
          $exe2=Get-ChildItem app/desktop-club/dist -Filter *.exe
          if (!$exe1 -or !$exe2) { throw 'Windows installers missing' }
          mkdir windows-artifacts -ErrorAction SilentlyContinue
          $exe1 | ForEach-Object { Copy-Item $_.FullName windows-artifacts/ }
          $exe2 | ForEach-Object { Copy-Item $_.FullName windows-artifacts/ }
          Get-ChildItem windows-artifacts/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content windows-artifacts/SHA256SUMS.txt
          "V6 source: $(git -C app rev-parse HEAD)" | Set-Content windows-artifacts/PROVENANCE.txt
          "Workspace source: $(git -C workspace rev-parse HEAD)" | Add-Content windows-artifacts/PROVENANCE.txt
          "Unsigned Windows x64 test builds. Test before distribution." | Add-Content windows-artifacts/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: athlys-v6-unified-windows-x64-unsigned
          path: windows-artifacts/
          if-no-files-found: error
          retention-days: 14
