name: Public native language-model smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/flm-native-smoke-20261124.yml'
permissions: {}
jobs:
  public-base-conversion:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/flm-native-smoke-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Verify official public native snapshot and tensor dimensions
        run: |
          set -eu
          python -m venv /tmp/flm-conversion
          /tmp/flm-conversion/bin/pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          /tmp/flm-conversion/bin/pip install 'transformers==5.1.0' safetensors huggingface_hub sentencepiece numpy protobuf
          /tmp/flm-conversion/bin/python - <<'PY'
          import json, hashlib, pathlib, shutil
          from huggingface_hub import model_info, snapshot_download
          from safetensors import safe_open
          repo="LiquidAI/LFM2.5-350M"
          rev="9921cd4d82c0e3986887aa4b376f9446729ef8a3"
          names=["config.json","model.safetensors","tokenizer.json","tokenizer_config.json","chat_template.jinja","generation_config.json","LICENSE"]
          info=model_info(repo,revision=rev,files_metadata=True,token=False)
          assert info.sha==rev
          snapshot=pathlib.Path(snapshot_download(repo,revision=rev,allow_patterns=names,token=False))
          root=pathlib.Path("/tmp/public-native")
          root.mkdir(mode=0o700)
          hashes={}
          for name in names:
              p=root/name
              shutil.copyfile(snapshot/name,p)
              with p.open("rb") as f: hashes[name]=hashlib.file_digest(f,"sha256").hexdigest()
              remote=next(x for x in info.siblings if x.rfilename==name)
              if remote.lfs:
                  assert hashes[name]==remote.lfs.sha256
          assert (root/"model.safetensors").stat().st_size==708984464
          cfg=json.loads((root/"config.json").read_text())
          assert cfg["model_type"]=="lfm2"
          with safe_open(root/"model.safetensors",framework="pt",device="cpu") as f:
              shapes={k:list(f.get_slice(k).get_shape()) for k in f.keys()}
          print("PUBLIC_BASE_HASHES",json.dumps({"repo":repo,"revision":rev,"files":hashes}),flush=True)
          print("PUBLIC_BASE_SHAPES",json.dumps(shapes),flush=True)
          PY
      - name: Build official llama.cpp conversion tools
        run: |
          set -eu
          git clone --depth 1 --branch b12669 https://github.com/ggml-org/llama.cpp.git /tmp/llama-cpp
          cd /tmp/llama-cpp
          test "$(git rev-parse HEAD)" = "30ec35ae2e27f1eca486af02b9d3d53fa7a26950"
          echo "CONVERTER_REVISION $(git rev-parse HEAD)"
          /tmp/flm-conversion/bin/pip install -e ./gguf-py
          if [ -f requirements/requirements-convert_hf_to_gguf.txt ]; then
            /tmp/flm-conversion/bin/pip install -r requirements/requirements-convert_hf_to_gguf.txt
          fi
          # Legacy converter requirements downgrade Transformers; restore the
          # native checkpoint's previously verified tokenizer-compatible version.
          /tmp/flm-conversion/bin/pip install 'transformers==5.1.0' 'tokenizers==0.22.2'
          /tmp/flm-conversion/bin/python - <<'PY'
          import transformers
          from transformers import AutoTokenizer
          assert transformers.__version__=="5.1.0"
          tokenizer=AutoTokenizer.from_pretrained("/tmp/public-native",local_files_only=True,trust_remote_code=False)
          print("TOKENIZER_PREFLIGHT",type(tokenizer).__name__,len(tokenizer),flush=True)
          assert len(tokenizer)==65536
          PY
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --target llama-quantize llama-cli -j 2
      - name: Convert unmodified public base and quantize
        run: |
          set -eu
          cd /tmp/llama-cpp
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          /tmp/flm-conversion/bin/python convert_hf_to_gguf.py /tmp/public-native --outtype f16 --outfile /tmp/base-f16.gguf
          build/bin/llama-quantize /tmp/base-f16.gguf /tmp/base-q4_0.gguf Q4_0
          /tmp/flm-conversion/bin/python - <<'PY'
          import hashlib, json, pathlib
          result={}
          for name in ["base-f16.gguf","base-q4_0.gguf"]:
              p=pathlib.Path("/tmp")/name
              with p.open("rb") as f: assert f.read(4)==b"GGUF"
              with p.open("rb") as f: digest=hashlib.file_digest(f,"sha256").hexdigest()
              result[name]={"sha256":digest,"size":p.stat().st_size}
          print("PUBLIC_BASE_GGUF",json.dumps(result),flush=True)
          PY
          build/bin/llama-cli -m /tmp/base-q4_0.gguf -p 'Classify this fictional prescription: Jog for ten minutes.' -n 16 -t 2 --temp 0 --no-conversation </dev/null
          echo 'PUBLIC_BASE_CONVERSION_PASS: unmodified base only; no private adapter; no uploaded model; no Android validation'
