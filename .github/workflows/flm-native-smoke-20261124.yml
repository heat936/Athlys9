          openssl x509 -in /tmp/flm-recipient.pem -noout -fingerprint -sha256 | grep -Fi 'C1:ED:3F:38:1F:85:16:A8:E2:65:06:74:E9:AE:BF:79:9E:59:B7:99:23:83:27:F1:5E:E8:95:44:FB:8E:B0:26'
          tar -C /tmp/flm-checkpoint -czf /tmp/flm-checkpoint.tar.gz .
          mkdir -p /tmp/flm-sealed
          openssl cms -encrypt -binary -aes-256-gcm -in /tmp/flm-checkpoint.tar.gz -outform DER -out /tmp/flm-sealed/flm-research-checkpoint.cms /tmp/flm-recipient.pem
          test -s /tmp/flm-sealed/flm-research-checkpoint.cms
          sha256sum /tmp/flm-sealed/flm-research-checkpoint.cms
      - name: Upload only encrypted experimental adapter
        uses: actions/upload-artifact@v4
        with:
          name: flm-research-checkpoint-encrypted
          path: /tmp/flm-sealed/flm-research-checkpoint.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
