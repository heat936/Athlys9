name: Athlys V5 — isolated mock browser diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v5-browser-isolation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: ${{ matrix.revision == 'baseline' && 'redesign/charter-only-v4-20261118' || 'b5b24777a5ff7c569192aa25f57942b7de1a3707' }}
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare synthetic browser
        run: |
          set -euo pipefail
          if ! (npm install --no-audit --no-fund && npm run build:web && python -m pip install playwright==1.58.0 && python -m playwright install chromium) >/tmp/setup.log 2>&1; then
            echo "::error::SETUP_FAILED"; exit 1
          fi
      - name: Run mobile mock and print bounded diagnostic category only
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory web --bind 127.0.0.1 >/tmp/browser-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          python - <<'PY'
          import urllib.request,time
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8765/mobile.html",timeout=2)
                  break
              except Exception: time.sleep(.3)
          else: raise SystemExit("TEST_SERVER_UNAVAILABLE")
          PY
          if python tests/browser-v33-auth-mock.py >/tmp/mobile-run.log 2>&1; then
            echo "PASS: mobile mocked journeys"
          else
            python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/mobile-run.log').read_text(errors='replace')
          # Never emit raw traceback or app content. Only allow-listed issue types.
          tests={
            'LOGIN_LAYOUT': ['login submit button must be reachable'],
            'MOBILE_NAVIGATION': ['mobile-nav', 'aria-current'],
            'ASSISTANT_OVERLAP': ['assistant button obscures'],
            'LOGIN_ERROR_VIEW': ['Incorrect login error presentation'],
            'HORIZONTAL_OVERFLOW': ['horizontal overflow'],
            'BROWSER_JS_EXCEPTION': ['JS errors:'],
            'BROWSER_TIMEOUT': ['TimeoutError'],
            'SCRIPT_ASSERTION': ['AssertionError']
          }
          import json
          try:
              rows=json.loads(text)
          except ValueError:
              rows=[]
          failed=[x for x in rows if x.get('status')!='pass']
          allow={'anonymous','athlete','coach'}
          for row in failed[:3]:
              role=row.get('role','unknown')
              if role not in allow: role='unknown'
              width=row.get('width',0)
              if not isinstance(width,int) or width not in (360,393,768): width=0
              error=str(row.get('error','')).lower()
              category='OTHER'
              for name,patterns in tests.items():
                  if any(v.lower() in error for v in patterns):
                      category=name
                      break
              if category=='OTHER':
                  if 'locator.' in error: category='LOCATOR'
                  elif 'page.' in error: category='PAGE'
                  elif 'net::' in error: category='NETWORK'
                  elif 'strict mode' in error: category='SELECTOR'
              stage='AFTER_NAV' if row.get('navigation')=='4 tabs OK' else 'BEFORE_NAV'
              print(f'::error::MOBILE_{role.upper()}_{width}_{stage}_{category}')
          if not failed: print('::error::MOBILE_UNPARSEABLE_RESULT')
          PY
            exit 1
          fi
