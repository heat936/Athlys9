name: Athlys V13 coach invitation Android and Web QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/athlys-v13-coach-invite-qa.yml'
permissions:
  contents: read
  actions: read
jobs:
  qa:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/athlys-v13-coach-invite-qa-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 8d5360b7c95da2876b839d90755db39ed4e2b5b2
      EXPECTED_APK: 029caea7ba3293275095675f312b4c890daf727f15423260be0282e1fbdb5a48
      EXPECTED_WEB: 417fc654dc16af5563fda0cbb3795703bf7d1e4311decdfef4e5c8f6c7f1785f
    steps:
      - name: Checkout pinned distributable client and invitation tests only
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: 8d5360b7c95da2876b839d90755db39ed4e2b5b2
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/app.js
            /web/sw.js
            /tests/athlys-coach-invite.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify code and invitation browser-contract tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          node --check source/web/app.js
          node --check source/web/sw.js
          node source/tests/athlys-coach-invite.test.cjs source/web/app.js
      - name: Retrieve and validate previously signed staging baseline
        run: |
          set -euo pipefail
          mkdir -p baseline output
          gh run download 45409027088 --repo heat936/Athlys9 --name athlys-v12-android-web-qa --dir baseline
          echo "$EXPECTED_APK  baseline/Athlys-V12-FLM-Quantum-QA.apk" | sha256sum -c
          echo "$EXPECTED_WEB  baseline/Athlys-V12-Web-QA.zip" | sha256sum -c
          unzip -p baseline/Athlys-V12-FLM-Quantum-QA.apk assets/public/app-config.js | grep -q 'avonfqgechvrnqxmbufn.supabase.co'
          ! unzip -p baseline/Athlys-V12-FLM-Quantum-QA.apk assets/public/app-config.js | grep -q 'ixccwxonchzzjdjeajzw'
      - name: Overlay invitation changes and preserve all prior assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          src=Path("source/web")
          names=["app.js","sw.js"]
          for name in names: assert (src/name).is_file()
          for baseline,outfile,prefix in [("Athlys-V12-FLM-Quantum-QA.apk","Athlys-V13-Coach-Invite-QA-unsigned.apk","assets/public/"),("Athlys-V12-Web-QA.zip","Athlys-V13-Web-QA.zip","")]:
              changed={prefix+x for x in names}
              with ZipFile("baseline/"+baseline) as b,ZipFile("output/"+outfile,"w") as z:
                  assert len(b.namelist())==len(set(b.namelist()))
                  assert changed.issubset(b.namelist())
                  for info in b.infolist():
                      if info.filename in changed or (prefix and info.filename.startswith("META-INF/")):continue
                      z.writestr(info,b.read(info.filename))
                  for name in names:z.write(src/name,prefix+name,compress_type=ZIP_DEFLATED)
              with ZipFile("output/"+outfile) as z,ZipFile("baseline/"+baseline) as b:
                  for name in names:assert z.read(prefix+name)==(src/name).read_bytes()
                  assert z.read(prefix+"app-config.js")==b.read(prefix+"app-config.js")
                  assert b"join_coach_by_invitation" in z.read(prefix+"app.js")
                  assert b"athlys-shell-v49-coach-invite-qa" in z.read(prefix+"sw.js")
                  assert not any(n.lower().endswith((".gguf",".safetensors")) for n in z.namelist())
          print("PASS preserved staging configuration and verified exact invitation client bytes")
          PY
      - name: Sign test APK and verify archives
        run: |
          set -euo pipefail
          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 output/Athlys-V13-Coach-Invite-QA-unsigned.apk output/Athlys-V13-Coach-Invite-QA.apk
          pass="$(openssl rand -hex 20)"
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -alias athlys_v13_qa -keystore "$RUNNER_TEMP/qa.jks" -storepass "$pass" -keypass "$pass" -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=Athlys V13 QA, O=Athlys, C=FR' >/dev/null 2>&1
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/qa.jks" --ks-key-alias athlys_v13_qa --ks-pass "pass:$pass" --key-pass "pass:$pass" --v2-signing-enabled true output/Athlys-V13-Coach-Invite-QA.apk
          "$TOOLS/apksigner" verify --verbose output/Athlys-V13-Coach-Invite-QA.apk
          "$TOOLS/zipalign" -c -p 4 output/Athlys-V13-Coach-Invite-QA.apk
          unzip -t output/Athlys-V13-Coach-Invite-QA.apk >/dev/null
          unzip -t output/Athlys-V13-Web-QA.zip >/dev/null
          rm output/*unsigned.apk "$RUNNER_TEMP/qa.jks"
          (cd output && sha256sum Athlys-V13-Coach-Invite-QA.apk Athlys-V13-Web-QA.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: athlys-v13-android-web-qa
          path: output/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
