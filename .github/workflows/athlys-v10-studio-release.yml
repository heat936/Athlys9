name: Athlys V10 Studio QA — verified public APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v10-studio-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: athlys-v10-qa-android
          run-id: 45232551470
          github-token: ${{ github.token }}
          path: artifacts
      - name: Confirm exact QA APK and source content
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sed -i 's#release/Athlys-V10-Test-Android.apk#Athlys-V10-Test-Android.apk#' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t Athlys-V10-Test-Android.apk >/dev/null
          for file in studio.js studio-core.js studio.html studio.css; do
            unzip -Z1 Athlys-V10-Test-Android.apk | grep -Fx "assets/public/$file" >/dev/null
          done
          unzip -p Athlys-V10-Test-Android.apk assets/public/assets/athlys-v10-trajectoire.mp4 | sha256sum | grep -F '78e80c868b6d4bb2b87d3248598d1943b48801f046cf603cfb2ddc8615408bef'
          mv Athlys-V10-Test-Android.apk Athlys-V10-Studio-QA.apk
          sha256sum Athlys-V10-Studio-QA.apk > SHA256-V10-Studio.txt
          echo 'PASS: Studio APK and original Athlys opening verified'
      - name: Publish distinct side-by-side Studio QA prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view athlys-v10-studio-qa >/dev/null 2>&1; then
            gh release upload athlys-v10-studio-qa artifacts/Athlys-V10-Studio-QA.apk artifacts/SHA256-V10-Studio.txt --clobber
          else
            gh release create athlys-v10-studio-qa \
              artifacts/Athlys-V10-Studio-QA.apk artifacts/SHA256-V10-Studio.txt \
              --title 'Athlys V10 Studio — Android QA' \
              --notes 'Version de test installable à côté de v9 et v10preview (com.athlys.v10studioqa). Intègre Training Studio, Strength Lab, Testing Lab, Quantum Baseline, Dual Perception et la séquence originale Trajectoire. Tests de logique et build CI réussis, accès RLS simulés en transaction sur la base de test. Authentification multi-compte réelle et synchronisation Android-PC non validées. Signature debug; ne pas considérer comme une release de production.' \
              --prerelease
          fi
          gh release view athlys-v10-studio-qa --json assets --jq '.assets[].name' | grep -Fx Athlys-V10-Studio-QA.apk
          echo 'PASS: public Studio QA asset is ready'
