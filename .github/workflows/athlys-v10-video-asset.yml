name: Athlys official V10 opening — verified media release
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-v10-video-asset.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch brand-approved MP4 and verify exact checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 45 --silent --show-error \
            'https://at.adobe.com/uf53Yl012Hd8Qkvx' -o athlys-opening-v10.mp4
          test "$(stat -c %s athlys-opening-v10.mp4)" -eq 140824
          test "$(sha256sum athlys-opening-v10.mp4 | cut -d' ' -f1)" = '8833b04706df146f23866d266e60ba5368097c40bc2842ea1525d1eb6ee9fe37'
          file athlys-opening-v10.mp4 | grep -E 'ISO Media|MP4' >/dev/null
          echo 'PASS: official original Athlys opening MP4 byte-identical'
      - name: Publish verified branded video as stable public release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view athlys-v10-opening >/dev/null 2>&1; then
            gh release upload athlys-v10-opening athlys-opening-v10.mp4 --clobber
          else
            gh release create athlys-v10-opening athlys-opening-v10.mp4 \
              --title 'Athlys V10 - animation d ouverture officielle' \
              --notes 'Animation officielle couleur 1080x1920 3 secondes, avec prononciation Athlys. SHA256 vérifiée. Média de marque uniquement.' \
              --prerelease
          fi
          gh release view athlys-v10-opening --json assets --jq '.assets[].name' | grep -qx 'athlys-opening-v10.mp4'
          echo 'PASS: permanent public release asset published'
