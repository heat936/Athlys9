name: Athlys FLM — real GGUF inference inside Android 14 WebView (isolated QA)
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-flm-real-weights-android-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      GGUF_SHA: 85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50
      REV: 657e078c94084481950a2d555a941481f715536b
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Retrieve exact FLM/Quantum staging APK and pinned official 350M model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa
          gh release download athlys-v10-flm-quantum-qa-20261123 --repo heat936/Athlys9 \
            --pattern Athlys-V10-FLM-Quantum.apk --dir qa
          echo 'f784e4f3f849a667ffc5cd5c8cb8093ceb164b5fece212a4c29462684403c1f4  qa/Athlys-V10-FLM-Quantum.apk' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 420 \
           "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/$REV/LFM2.5-350M-Q4_0.gguf?download=true" \
           -o qa/model.gguf
          echo "$GGUF_SHA  qa/model.gguf" | sha256sum -c -
          test "$(stat -c %s qa/model.gguf)" = 219309792
          npm install --no-audit --no-fund --no-save --prefix qa playwright-core@1.58.2
          echo 'PASS Android test inputs are verified pinned artifacts and signed QA APK'
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android WebView remote-debug QA scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > qa/webview-test.cjs <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const run=(...args)=>execFileSync('adb',args,{encoding:'utf8',timeout:35000});
          const report={device:'Android 14 emulator WebView',actualModelInference:false,physicalDevice:false,
           source:'official 350M Q4_0 SHA-256 checked on runner',origin:'APK-only https://localhost'};
          let websocket=null;
          const fail=e=>{report.status='NO_GO';report.failure=String(e?.message||e).slice(0,185);
           fs.writeFileSync('qa/android-webview-result.json',JSON.stringify(report,null,2));
           console.error('NO_GO_ANDROID_WEBVIEW '+report.failure);process.exitCode=1};
          (async()=>{
           const pid=run('shell','pidof','com.athlys.v10irlqa').trim().split(/\s+/)[0];
           assert(/^[0-9]+$/.test(pid),'APK_NOT_RUNNING');
           const unix=run('shell','cat','/proc/net/unix');
           const match=unix.match(/@?(webview_devtools_remote_[0-9]+)/g);
           assert(match?.length,'WEBVIEW_DEBUG_SOCKET_UNAVAILABLE');
           const socket=match[0].replace(/^@/,'');
           run('forward','tcp:9222','localabstract:'+socket);
           const targets=await fetch('http://127.0.0.1:9222/json/list',{signal:AbortSignal.timeout(14000)}).then(r=>r.json());
           const target=targets.find(t=>t.type==='page'&&t.webSocketDebuggerUrl)||targets.find(t=>t.webSocketDebuggerUrl);
           assert(target?.webSocketDebuggerUrl,'CDP_PAGE_TARGET_NOT_FOUND');
           const url=new URL(target.webSocketDebuggerUrl);
           url.hostname='127.0.0.1'; url.port='9222';
           websocket=new WebSocket(url.href);
           await new Promise((resolve,reject)=>{
            const tm=setTimeout(()=>reject(new Error('CDP_WEBSOCKET_OPEN_TIMEOUT')),14000);
            websocket.onopen=()=>{clearTimeout(tm);resolve()};
            websocket.onerror=()=>{clearTimeout(tm);reject(new Error('CDP_WEBSOCKET_FAILED'))};
           });
           let seq=0;const pending=new Map();
           websocket.onmessage=event=>{
            let message;try{message=JSON.parse(event.data)}catch{return}
            if(message.id&&pending.has(message.id)){
             const entry=pending.get(message.id);pending.delete(message.id);clearTimeout(entry.timer);
             message.error?entry.reject(new Error('CDP_'+message.error.message)):entry.resolve(message.result);
            }
           };
           function send(method,params={},timeout=25000){
            return new Promise((resolve,reject)=>{
             const id=++seq;
             const timer=setTimeout(()=>{pending.delete(id);reject(new Error('CDP_TIMEOUT_'+method))},timeout);
             pending.set(id,{resolve,reject,timer});
             websocket.send(JSON.stringify({id,method,params}));
            });
           }
           async function evaluate(expression,timeout=60000){
            const result=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true},timeout);
            if(result.exceptionDetails)throw Error('JS_EVAL_'+String(result.exceptionDetails.text||'UNHANDLED').slice(0,100));
            return result.result?.value;
           }
           const origin=await evaluate('({origin:location.origin,cap:window.Capacitor?.getPlatform?.(),language:!!window.AthlysFeatherLanguage,secure:isSecureContext})');
           assert(origin.language&&origin.secure,'REAL_ANDROID_WEBVIEW_FLMLANGUAGE_MISSING');
           assert(origin.origin==='https://localhost','WRONG_ANDROID_WEBVIEW_ORIGIN_'+origin.origin);
           assert(origin.cap==='android','WRONG_NATIVE_PLATFORM_'+origin.cap);
           console.log('PASS Android WebView CDP attaches to native Capacitor and local FLM runtime');
           const state=await evaluate('(async()=>{window.qaFLM=window.AthlysFeatherLanguage.create(null);return await window.qaFLM.refresh(true)})()',30000);
           assert(state.platform==='android','FLM_NOT_ROUTED_TO_ANDROID');
           const appFiles=run('shell','run-as','com.athlys.v10irlqa','pwd').trim();
           const filePath=appFiles+'/files/athlys-qa-model.gguf';
           await evaluate('(()=>{const i=document.createElement("input");i.type="file";i.id="qa-model";document.body.appendChild(i);return true})()');
           const root=await send('DOM.getDocument',{depth:1,pierce:true});
           const node=await send('DOM.querySelector',{nodeId:root.root.nodeId,selector:'#qa-model'});
           assert(node?.nodeId,'FILE_INPUT_NOT_PRESENT');
           await send('DOM.setFileInputFiles',{nodeId:node.nodeId,files:[filePath]},60000);
           const size=await evaluate('document.getElementById("qa-model").files[0]?.size||0');
           assert.equal(size,219309792,'ANDROID_FILE_SIZE_MISMATCH');
           console.log('PASS Android WebView received 219MB real official GGUF in private app storage');
           const installed=await evaluate('(async()=>{await window.qaFLM.install(document.getElementById("qa-model").files[0]);return window.qaFLM.modelState()})()',110000);
           assert(installed.installed,'ANDROID_MODEL_INSTALL_FAILED');
           console.log('PASS Android WebView imported and verified real model SHA in CacheStorage');
           const began=Date.now();
           const result=await evaluate('(async()=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),190000);try{const r=await window.qaFLM.generateStructured({task:"assistant.explain",schemaVersion:window.AthlysFeatherLanguage.version,input:{text:"En sport, que signifie RPE ?"},signal:c.signal});return {status:r.status,provenance:r.engine?.provenance,length:r.candidate?.reply?.length||0}}finally{clearTimeout(t)}})()',225000);
           assert.equal(result.status,'ok','MODEL_INFERENCE_'+result.status);
           assert.equal(result.provenance,'local');
           assert(result.length>=10);
           report.actualModelInference=true;
           report.generationMs=Date.now()-began;
           report.replyLength=result.length;
           report.status='PASS';
           fs.writeFileSync('qa/android-webview-result.json',JSON.stringify(report,null,2));
           console.log('PASS REAL_ANDROID_WEBVIEW_GGUF_INFERENCE generation_ms='+report.generationMs);
          })().catch(fail).finally(()=>{if(websocket)websocket.close()});
          NODE
          cat > qa/run-android-webview.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          adb install -r qa/Athlys-V10-FLM-Quantum.apk
          adb shell am start -n com.athlys.v10irlqa/.MainActivity
          for i in $(seq 1 50); do
            adb shell pidof com.athlys.v10irlqa >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 12
          adb shell pidof com.athlys.v10irlqa | grep -Eq '[0-9]+'
          adb push qa/model.gguf /data/local/tmp/athlys-model.gguf >/dev/null
          adb shell chmod 644 /data/local/tmp/athlys-model.gguf
          adb shell run-as com.athlys.v10irlqa cp /data/local/tmp/athlys-model.gguf files/athlys-qa-model.gguf
          adb shell run-as com.athlys.v10irlqa ls -l files/athlys-qa-model.gguf
          node qa/webview-test.cjs
          adb shell run-as com.athlys.v10irlqa rm -f files/athlys-qa-model.gguf || true
          adb shell rm -f /data/local/tmp/athlys-model.gguf || true
          BASH
          chmod +x qa/run-android-webview.sh
      - name: Android 14 in-emulator real WebView GGUF test (not a physical handset)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          emulator-boot-timeout: 480
          disable-animations: true
          script: bash qa/run-android-webview.sh
      - name: Delete model and preserve redacted status only
        if: always()
        shell: bash
        run: |
          rm -f qa/model.gguf
          echo 'Never publish model GGUF or personal data in QA evidence'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlys-flm-android-webview-real-weights-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: qa/android-webview-result.json
