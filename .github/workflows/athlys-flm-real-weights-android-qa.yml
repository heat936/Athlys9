name: Athlys FLM — real GGUF inference inside Android 14 WebView (isolated QA)
on:
  push:
    branches: [main]
    paths: [.github/workflows/athlys-flm-real-weights-android-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      GGUF_SHA: 85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50
      REV: 657e078c94084481950a2d555a941481f715536b
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Retrieve exact FLM/Quantum staging APK and pinned official 350M model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa
          gh release download athlys-v10-flm-quantum-qa-20261123 --repo heat936/Athlys9 \
            --pattern Athlys-V10-FLM-Quantum.apk --dir qa
          echo 'f784e4f3f849a667ffc5cd5c8cb8093ceb164b5fece212a4c29462684403c1f4  qa/Athlys-V10-FLM-Quantum.apk' | sha256sum -c -
          curl -fsSL --retry 2 --max-time 420 \
           "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/$REV/LFM2.5-350M-Q4_0.gguf?download=true" \
           -o qa/model.gguf
          echo "$GGUF_SHA  qa/model.gguf" | sha256sum -c -
          test "$(stat -c %s qa/model.gguf)" = 219309792
          npm install --no-audit --no-fund --no-save --prefix qa playwright-core@1.58.2
          echo 'PASS Android test inputs are verified pinned artifacts and signed QA APK'
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android WebView remote-debug QA scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > qa/webview-test.cjs <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const {chromium}=require('playwright-core');
          const run=(...args)=>execFileSync('adb',args,{encoding:'utf8',timeout:30000});
          const pid=run('shell','pidof','com.athlys.v10irlqa').trim().split(/\s+/)[0];
          assert(/^[0-9]+$/.test(pid),'APK_NOT_RUNNING');
          const unix=run('shell','cat','/proc/net/unix');
          const match=unix.match(/@?(webview_devtools_remote_[0-9]+)/g);
          assert(match?.length,'WEBVIEW_DEBUG_SOCKET_UNAVAILABLE');
          const socket=match[0].replace(/^@/,'');
          run('forward','tcp:9222','localabstract:'+socket);
          const report={device:'Android 14 emulator WebView',apk_sha256:'f784e4f3f849a667ffc5cd5c8cb8093ceb164b5fece212a4c29462684403c1f4',
            source:'official pinned LFM2.5-350M Q4_0',modelSize:219309792,weightVerified:true,
            actualModelInference:false,physicalDevice:false,sourceOfWebview:'APK QA local https://localhost'};
          const fail=e=>{report.status='NO_GO';report.failure=String(e?.message||e).slice(0,160);fs.writeFileSync('qa/android-webview-result.json',JSON.stringify(report,null,2));console.error('NO_GO_ANDROID_WEBVIEW '+report.failure);process.exitCode=1};
          (async()=>{
            const browser=await chromium.connectOverCDP('http://127.0.0.1:9222',{timeout:20000});
            try{
              const pages=browser.contexts().flatMap(c=>c.pages());
              const page=pages.find(p=>(p.url()||'').includes('localhost'))||pages[0];
              assert(page,'WEBVIEW_PAGE_MISSING');
              console.log('PASS real Android APK WebView debugging socket and page');
              const present=await page.evaluate(()=>({lm:!!window.AthlysFeatherLanguage,url:location.origin,secure:isSecureContext}));
              assert(present.lm && present.secure,'WEBVIEW_FLMLANGUAGE_NOT_AVAILABLE');
              assert(present.url==='https://localhost','INVALID_EMULATOR_WEBVIEW_ORIGIN');
              const platform=await page.evaluate(async()=>{
                window.qaFLM=window.AthlysFeatherLanguage.create(null);
                return window.qaFLM.refresh(true);
              });
              assert(platform.platform==='android','EXPECTED_NATIVE_ANDROID');
              const appFiles=run('shell','run-as','com.athlys.v10irlqa','pwd').trim();
              const modelPath=appFiles+'/files/athlys-qa-model.gguf';
              const session=await page.context().newCDPSession(page);
              await page.evaluate(()=>{const input=document.createElement('input');input.type='file';input.id='qa-model';document.body.appendChild(input)});
              const root=await session.send('DOM.getDocument',{depth:1});
              const node=await session.send('DOM.querySelector',{nodeId:root.root.nodeId,selector:'#qa-model'});
              await session.send('DOM.setFileInputFiles',{nodeId:node.nodeId,files:[modelPath]});
              const hasFile=await page.evaluate(()=>document.getElementById('qa-model').files[0]?.size||0);
              assert.equal(hasFile,219309792,'MODEL_NOT_LOADED_IN_ANDROID_FILE_INPUT');
              console.log('PASS official GGUF selected in actual Android WebView via app-private temporary file');
              await page.evaluate(()=>window.qaFLM.install(document.getElementById('qa-model').files[0]));
              const started=Date.now();
              const inference=await page.evaluate(async()=>{
                const control=new AbortController(),timeout=setTimeout(()=>control.abort(),190000);
                try{return await window.qaFLM.generateStructured({task:'assistant.explain',schemaVersion:window.AthlysFeatherLanguage.version,
                  input:{text:"En sport, que signifie RPE ?"},signal:control.signal});}
                finally{clearTimeout(timeout)}
              });
              assert.equal(inference.status,'ok');
              assert.equal(inference.engine.provenance,'local');
              assert(inference.candidate.reply.length>=10);
              report.actualModelInference=true;
              report.generationMs=Date.now()-started;
              report.replyLength=inference.candidate.reply.length;
              report.status='PASS';
              fs.writeFileSync('qa/android-webview-result.json',JSON.stringify(report,null,2));
              console.log('PASS REAL_ANDROID_WEBVIEW_GGUF_INFERENCE generation_ms='+report.generationMs+' reply_length='+report.replyLength);
            }finally{await browser.close()}
          })().catch(fail);
          NODE
          cat > qa/run-android-webview.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          adb install -r qa/Athlys-V10-FLM-Quantum.apk
          adb shell am start -n com.athlys.v10irlqa/.MainActivity
          for i in $(seq 1 50); do
            adb shell pidof com.athlys.v10irlqa >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 12
          adb shell pidof com.athlys.v10irlqa | grep -Eq '[0-9]+'
          adb push qa/model.gguf /data/local/tmp/athlys-model.gguf >/dev/null
          adb shell chmod 644 /data/local/tmp/athlys-model.gguf
          adb shell run-as com.athlys.v10irlqa cp /data/local/tmp/athlys-model.gguf files/athlys-qa-model.gguf
          adb shell run-as com.athlys.v10irlqa ls -l files/athlys-qa-model.gguf
          node qa/webview-test.cjs
          adb shell run-as com.athlys.v10irlqa rm -f files/athlys-qa-model.gguf || true
          adb shell rm -f /data/local/tmp/athlys-model.gguf || true
          BASH
          chmod +x qa/run-android-webview.sh
      - name: Android 14 in-emulator real WebView GGUF test (not a physical handset)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          emulator-boot-timeout: 480
          disable-animations: true
          script: bash qa/run-android-webview.sh
      - name: Delete model and preserve redacted status only
        if: always()
        shell: bash
        run: |
          rm -f qa/model.gguf
          echo 'Never publish model GGUF or personal data in QA evidence'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlys-flm-android-webview-real-weights-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: qa/android-webview-result.json
