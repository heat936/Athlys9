name: Athlys V10 Excel — verified debug APK prerelease after CI
on:
  workflow_run:
    workflows:
      - Athlys V10 Excel Intelligence — Android staging candidate
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download signed staging QA APK from precise successful CI run
        uses: actions/download-artifact@v4
        with:
          name: athlys-v10-excel-qa
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify SHA-256, package contents and Supabase staging identity
        shell: bash
        run: |
          set -euo pipefail
          cd package
          sed -i 's#release/Athlys-V10-Excel-IRL.apk#Athlys-V10-Excel-IRL.apk#' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t Athlys-V10-Excel-IRL.apk >/dev/null
          test "$(stat -c %s Athlys-V10-Excel-IRL.apk)" -gt 1000000
          for file in athlys-training-intelligence.js athlys-xlsx-reader.js athlys-excel-import.js athlys-excel-import.css; do
            unzip -Z1 Athlys-V10-Excel-IRL.apk | grep -qx "assets/public/$file"
          done
          unzip -p Athlys-V10-Excel-IRL.apk assets/public/app-config.js | grep -q 'avonfqgechvrnqxmbufn.supabase.co'
          ! unzip -p Athlys-V10-Excel-IRL.apk assets/public/app-config.js | grep -q 'ixccwxonchzzjdjeajzw'
          echo 'PASS verified Athlys Excel APK checksum and isolated staging code'
      - name: Create one immutable downloadable QA prerelease (no production)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=athlys-v10-excel-irl-qa-20261123
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing QA release preserved: never overwrite an already distributed APK'
          else
            gh release create "$TAG" \
              package/Athlys-V10-Excel-IRL.apk package/SHA256SUMS.txt \
              --title 'Athlys V10 Excel Intelligence — APK de recette' \
              --notes 'Préversion Android de recette uniquement ; package distinct com.athlys.v10excelqa et signature debug. Module Excel XLSX/CSV local, aperçu et confirmation utilisateur, Supabase Athlys2 staging. Les données importées alimentent le journal ; contribution éventuelle au dataset ML strictement soumise à consentement séparé de l’athlète, revue privée et aucune mise à jour automatique des modèles. Utiliser exclusivement des données fictives ; JWT coach/athlète/tiers et synchronisation multi-appareils non validés. Web staging : https://athlys-v10-irl-staging.vercel.app/app.html. Guide : https://github.com/heat936/Athlys9/blob/main/pilot-v10-irl/README.md.' \
              --prerelease
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'Athlys-V10-Excel-IRL.apk'
          echo 'PASS stage-only Excel APK release exists'
