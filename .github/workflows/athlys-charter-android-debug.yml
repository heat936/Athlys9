name: Athlys redesigned Android — debug build verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/athlys-charter-android-debug.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: d12c4f714188499fef8ee4a329694b352aff1c1b
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = "d12c4f714188499fef8ee4a329694b352aff1c1b"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and validate UI contract
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run test:visual-charter
          npm run build:web
      - name: Prepare Android project
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android
      - name: Ensure Health Connect minimum SDK and Java desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('android/app/build.gradle')
          text=gradle.read_text()
          if 'coreLibraryDesugaringEnabled' not in text:
              if 'compileOptions {' not in text:
                  text=text.replace('android {','android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }',1)
              text=text.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in text:
              text=text.replace('dependencies {',"dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'",1)
          gradle.write_text(text)
          variables=Path('android/variables.gradle')
          data,count=re.subn(r'(minSdkVersion\s*=\s*)\d+',r'\g<1>26',variables.read_text(),count=1)
          if count!=1: raise SystemExit('Missing minSdkVersion')
          variables.write_text(data)
          PY
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Validate packaged official charter assets and hash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q 'assets/public/athlys-charter-reset.css'
          unzip -Z1 "$APK" | grep -q 'assets/public/athlys-club-charter.css'
          sha256sum "$APK" > athlys-charter-android-debug.sha256
          python3 - <<'PY'
          import json,subprocess,os,pathlib
          doc={'source_repository':'heat936/Athlys2','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
               'workflow_repository':os.getenv('GITHUB_REPOSITORY'),'workflow_run_id':os.getenv('GITHUB_RUN_ID'),
               'build_type':'debug-not-production'}
          pathlib.Path('athlys-android-provenance.json').write_text(json.dumps(doc,indent=2)+'\n')
          PY
      - name: Upload debug APK and checksums only
        uses: actions/upload-artifact@v4
        with:
          name: athlys-20261119-charter-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            athlys-charter-android-debug.sha256
            athlys-android-provenance.json
          retention-days: 14
          if-no-files-found: error
