name: Athlys Field Beta — isolated Android APK emulator
on:
  push:
    branches: [main]
    paths: ['.github/workflows/athlys-field-beta-isolated-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Download exact successful candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: athlys-field-beta-isolated-20261120-android-debug
          run-id: 44753098439
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify artifact provenance and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find candidate -type f -maxdepth 8
          APK="$(find candidate -name app-debug.apk -type f -print -quit)"
          test -n "$APK"
          test -s "$APK"
          (cd candidate && sha256sum -c candidate-android.sha256 && sha256sum -c candidate-provenance.sha256)
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("candidate/candidate-provenance.json").read_text())
          assert p["source_commit"]=="f236f334523bec15c7b3e534c4340c03868f85c1"
          assert p["run_id"]=="44753098439"
          print("PASS: immutable source provenance")
          PY
          unzip -t "$APK" > /tmp/field-beta-apk-zip-test.txt
          mkdir -p qa
          cp candidate/candidate-provenance.json qa/candidate-provenance.json
          echo "PASS: exact release APK passed archive and checksum checks"
      - name: Detect KVM acceleration with software fallback
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "accel=on" >> "$GITHUB_OUTPUT"
            echo "KVM hardware acceleration available"
          else
            echo "accel=off" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM unavailable; attempt emulator with software acceleration"
          fi
      - name: Create single-shell emulator smoke script
        shell: bash
        run: |
          set -euo pipefail
          cat > qa/run-emulator-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$(find candidate -name app-debug.apk -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          adb install -r "$APK"
          adb shell am start -n com.athlys.app/.MainActivity
          sleep 18
          adb shell pidof com.athlys.app | grep -Eq '[0-9]+'
          adb shell dumpsys activity activities | grep -E 'com.athlys.app|MainActivity' > qa/android-foreground.txt
          adb shell screencap -p /sdcard/athlys-field-beta.png
          adb pull /sdcard/athlys-field-beta.png qa/android-launch.png
          test -s qa/android-launch.png
          echo 'PASS: installed, launched and captured exact candidate APK'
          SCRIPT
          chmod +x qa/run-emulator-smoke.sh
      - name: Android 14 install and foreground startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel ${{ steps.kvm.outputs.accel }}
          script: |
            bash qa/run-emulator-smoke.sh
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-field-beta-isolated-emulator-evidence
          retention-days: 14
          if-no-files-found: warn
          path: qa/
