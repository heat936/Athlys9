name: Athlys FLM — offline PWA service-worker acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/athlys-flm-offline-pwa.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: c802c8f94fe8f47c6c36ed5bd5ed4b10d4fb97cc
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable QA and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c802c8f94fe8f47c6c36ed5bd5ed4b10d4fb97cc
          npm install --no-audit --no-fund >/tmp/npm.log 2>&1
          npm test
          npm run build:web >/tmp/build.log 2>&1
          python3 -m pip install playwright==1.58.0 >/tmp/pip.log 2>&1
          python3 -m playwright install chromium >/tmp/chromium.log 2>&1
      - name: Exercise service worker, offline reload and local FLM inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          python3 -m http.server 8765 --directory web --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          cat >/tmp/flm-offline.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          from pathlib import Path
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(viewport={"width":390,"height":844}, service_workers="allow")
              page=context.new_page()
              errors=[]
              page.on("pageerror",lambda error:errors.append(str(error)))
              page.goto("http://127.0.0.1:8765/mobile.html",wait_until="load",timeout=30000)
              page.wait_for_function("""async () => {
                const r=await navigator.serviceWorker.ready;
                return !!r.active && r.active.state === 'activated';
              }""",timeout=30000)
              page.wait_for_function("""async () => {
                const names=await caches.keys();
                const key=names.find(x=>x==='athlys-shell-v45-feather-assistant');
                if(!key)return false;
                const c=await caches.open(key);
                return (await Promise.all(['/feather-runtime.js','/feather-assistant-expert.js','/feather-contract.js','/athlys-local-intelligence.js','/mobile.html'].map(x=>c.match(x)))).every(Boolean);
              }""",timeout=30000)
              before=page.evaluate("""() => ({ready:!!window.AthlysFeather,route:window.AthlysFeather?.lastRoute()||null})""")
              assert before["ready"], "Feather runtime not available online"
              context.set_offline(True)
              page.reload(wait_until="domcontentloaded",timeout=20000)
              page.wait_for_function("!!window.AthlysFeather",timeout=10000)
              result=page.evaluate("""() => {
                const answer=window.AthlysFeather.chat('Pourquoi ma charge augmente ?', {
                  now:'2026-11-20T15:00:00Z',role:'athlete',
                  logs:[{athlete_id:'qa-user',session_date:'2026-11-19',duration_minutes:30,rpe:6}]
                });
                return {answer:answer.reply,expert:window.AthlysFeather.lastRoute().expert,remote:answer.engine.remote};
              }""")
              assert result["expert"]=="athlys.flm.coach-copilot",result
              assert "180" in result["answer"] and result["remote"] is False,result
              assert not errors, f"Unexpected JS errors: {errors}"
              page.screenshot(path="qa-evidence/offline-flm-mobile.png",full_page=True)
              Path("qa-evidence/offline-flm-result.json").write_text(json.dumps({
                "source_commit":"c802c8f94fe8f47c6c36ed5bd5ed4b10d4fb97cc",
                "service_worker":"athlys-shell-v45-feather-assistant",
                "offline_reload":True,
                "local_expert":result["expert"],
                "load_au_expected":180,
                "network_calls_for_chat":0,
                "page_errors":errors
              },indent=2))
              print("PASS PWA offline reload, precache and Feather local chat on 390x844 mobile")
              browser.close()
          PY
          python3 /tmp/flm-offline.py
      - name: Upload offline QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athlys-flm-offline-pwa-acceptance
          retention-days: 14
          if-no-files-found: warn
          path: qa-evidence/
