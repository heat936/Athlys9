name: Athlys QA — safe official Auth prerequisites
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/athlys-real-auth-credentials-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required QA-only credentials without exposing values
        shell: bash
        env:
          STAGING_ADMIN: ${{ secrets.ATHLYS_QA_SERVICE_ROLE_KEY }}
          QA_DOMAIN: ${{ secrets.ATHLYS_QA_EMAIL_DOMAIN }}
          PRIVATE_READ: ${{ secrets.ATHLYS_READ_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "STAGING_ADMIN:Supabase_staging_Auth_admin" "QA_DOMAIN:Authorized_QA_email_domain" "PRIVATE_READ:GitHub_private_source_read"; do
            key="${pair%%:*}"
            label="${pair#*:}"
            if test -n "${!key}"; then
              echo "PASS prerequisite $label is present"
            else
              echo "BLOCKED prerequisite $label is absent"
              failed=1
            fi
          done
          test "$failed" -eq 0
# IRL preflight 2026-11-23: values never printed; existence only.
