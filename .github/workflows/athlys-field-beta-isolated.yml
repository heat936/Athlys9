name: Athlys Field Beta — isolated Android and Web QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/athlys-field-beta-isolated.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout pinned private application source
        uses: actions/checkout@v4
        with:
          repository: heat936/Athlys2
          ref: b1887c231d87941e07ddcb087548c8994c81b055
          token: ${{ secrets.ATHLYS_READ_TOKEN }}
          persist-credentials: false
      - name: Record immutable candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b1887c231d87941e07ddcb087548c8994c81b055"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = {
              "source_repo": "heat936/Athlys2",
              "source_commit": subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "runner_repo": os.environ["GITHUB_REPOSITORY"],
              "runner_workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "candidate": "field-beta-isolated-android-web-20261120",
              "distribution": "closed-test-debug-not-production"
          }
          Path("candidate-provenance.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify web and product contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in web/app.js web/mobile.js web/club.js web/unified-workspace.js web/sw.js; do
            if ! node --check "$file" >/tmp/field-syntax.log 2>&1; then
              echo "::error::SYNTAX_FAILURE_$(basename "$file")"; exit 1
            fi
          done
          if ! npm test >/tmp/field-tests.log 2>&1; then
            echo "::error::CORE_TESTS_FAILED"; exit 1
          fi
          echo "PASS: source syntax and core Node tests"
      - name: Guard isolated Supabase target
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'avonfqgechvrnqxmbufn.supabase.co' web/app-config.js
          if grep -q 'ixccwxonchzzjdjeajzw' web/app-config.js; then
            echo "::error::QA_CLIENT_POINTS_AT_EXISTING_DATA"; exit 1
          fi
          echo "PASS: QA client points to isolated project"
      - name: Assemble web frontend
        shell: bash
        run: |
          set -euo pipefail
          if ! (npm install --no-audit --no-fund && npm run build:web) >/tmp/field-web-build.log 2>&1; then
            echo "::error::WEB_BUILD_FAILED"; exit 1
          fi
          test -s web/index.html
          test -s web/club-app.html
          test -s web/unified-workspace.js
          test -s web/unified-workspace.css
          echo "PASS: web assets assembled"
      - name: Build Android debug candidate
        shell: bash
        run: |
          set -euo pipefail
          cp web/mobile.html web/index.html
          grep -q 'data-athlys-mobile="true"' web/index.html
          if ! (test -f android/gradlew || npx cap add android) >/tmp/field-android-setup.log 2>&1; then
            echo "::error::ANDROID_PROJECT_CREATION_FAILED"; exit 1
          fi
          if ! npx cap sync android >>/tmp/field-android-setup.log 2>&1; then
            echo "::error::ANDROID_SYNC_FAILED"; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "coreLibraryDesugaringEnabled" not in s:
              if "compileOptions {" not in s:
                  s=s.replace("android {","android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }",1)
              s=s.replace("compileOptions {","compileOptions {\n        coreLibraryDesugaringEnabled true",1)
          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:" not in s:
              s=s.replace("dependencies {","dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'",1)
          p.write_text(s)
          v=Path("android/variables.gradle")
          t,n=re.subn(r"(minSdkVersion\s*=\s*)\d+",r"\g<1>26",v.read_text(),count=1)
          if n!=1: raise SystemExit("Android minSdk variable unavailable")
          v.write_text(t)
          PY
          chmod +x android/gradlew
          if ! (cd android && ./gradlew assembleDebug --no-daemon) >/tmp/field-gradle.log 2>&1; then
            echo "::error::ANDROID_GRADLE_FAILED"; exit 1
          fi
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > candidate-android.sha256
          sha256sum candidate-provenance.json > candidate-provenance.sha256
          echo "PASS: Android debug APK built and checksummed"
      - name: Upload closed-test APK and provenance only
        uses: actions/upload-artifact@v4
        with:
          name: athlys-field-beta-isolated-20261120-android-debug
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            candidate-android.sha256
            candidate-provenance.json
            candidate-provenance.sha256
